services:
  zvm:
    build:
      context: .
      dockerfile: Dockerfile
    image: zvm:local
    container_name: zvm_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ── Obrigatórios ──────────────────────────────────────────────────────────
      - MONGODB_URI=${MONGODB_URI}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASS=${ADMIN_PASS}
      # ── Segurança ─────────────────────────────────────────────────────────────
      - APP_SECRET=${APP_SECRET}
      - TOTP_SECRET=${TOTP_SECRET}
      - PAYT_SECRET=${PAYT_SECRET}
      - ANALYTICS_PASS=${ANALYTICS_PASS}
      # ── Moderadores (opcional) ────────────────────────────────────────────────
      - MOD_USER=${MOD_USER:-}
      - MOD_PASS=${MOD_PASS:-}
      - MOD_TOTP=${MOD_TOTP:-}
      - MOD2_USER=${MOD2_USER:-}
      - MOD2_PASS=${MOD2_PASS:-}
      - MOD2_TOTP=${MOD2_TOTP:-}
      # ── Configuração ──────────────────────────────────────────────────────────
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-90}
      - LOG_MAX=${LOG_MAX:-500}
      - EXPIRY_WARN_HOURS=${EXPIRY_WARN_HOURS:-48}
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Limite de recursos — ajuste conforme plano do servidor
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
