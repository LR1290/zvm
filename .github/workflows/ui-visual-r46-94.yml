name: ZVM Chromium UI visual QA (R47.03)

on:
  pull_request:
    paths:
      - 'server.js'
      - 'assets/zvm-console-design.*.css'
      - 'assets/zvm-auth-premium.*.css'
      - 'assets/zvm-public-premium.*.css'
      - 'assets/zvm-sales-state.*.css'
      - 'assets/zvm-public-experience.*.css'
      - 'assets/zvm-reference-public.*.css'
      - 'assets/zvm-faq-experience.*.js'
      - 'assets/zvm-plans.*.js'
      - 'assets/zvm-legal-premium.*.css'
      - 'assets/zvm-analytics-premium.*.css'
      - 'assets/zvm-analytics-dashboard.*.js'
      - 'assets/zvm-analytics-lab.*.js'
      - 'src/web/public/landing/render.js'
      - 'assets/zvm-admin-dashboard.*.js'
      - 'tests/r46-94-chromium-visual.test.js'
      - 'tests/r46-95-auth-ui.test.js'
      - 'tests/r46-96-public-design.test.js'
      - 'tests/r46-96-public-chromium.test.js'
      - 'tests/r46-97-legal-analytics-chromium.test.js'
      - 'tests/r46-97-legal-analytics-design.test.js'
      - 'tests/r46-98-analytics-accessibility.test.js'
      - 'tests/r46-98-analytics-chromium.test.js'
      - 'tests/r46-99-sales-pause.test.js'
      - 'tests/r46-99-guest-checkout.test.js'
      - 'tests/r46-99-paused-chromium.test.js'
      - 'tests/r47-00-public-experience.test.js'
      - 'tests/r47-00-public-i18n.test.js'
      - 'src/web/public/i18n-copy.js'
      - 'src/web/public/i18n.js'
      - 'tests/r47-00-public-chromium.test.js'
      - 'tests/r47-01-reference-public.test.js'
      - 'tests/r47-01-reference-public-chromium.test.js'
      - 'tests/r47-02-trust-pages.test.js'
      - 'tests/r47-02-trust-chromium.test.js'
      - 'tests/r47-03-portal-chromium.test.js'
      - 'tests/r47-03-portal-trust.test.js'
      - 'src/web/public/i18n-copy.js'
      - '.github/workflows/ui-visual-r46-94.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install backend dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Install pinned Chromium test tool
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Browser QA with mock users (never production)
        env:
          CI: 'true'
        run: |
          node tests/r46-94-chromium-visual.test.js
          node tests/r46-96-public-chromium.test.js
          node tests/r46-97-legal-analytics-chromium.test.js
          node tests/r46-98-analytics-chromium.test.js
          node tests/r46-99-paused-chromium.test.js
          node tests/r47-00-public-chromium.test.js
          node tests/r47-01-reference-public-chromium.test.js
          node tests/r47-02-trust-chromium.test.js
          node tests/r47-03-portal-chromium.test.js
      - name: Upload visual screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zvm-r47-03-chromium-visuals
          path: artifacts/visual-qa/*.png
          if-no-files-found: ignore
          retention-days: 7
