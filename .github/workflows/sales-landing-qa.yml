name: ZVM Sales Landing QA
on:
  pull_request:
    paths:
      - 'server.js'
      - 'src/web/public/landing/sales.js'
      - 'assets/zvm-sales-landing.*.css'
      - 'tests/r47-sales-landing.test.js'
      - 'package.json'
      - '.github/workflows/sales-landing-qa.yml'
  workflow_dispatch:
jobs:
  audit-sales-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - name: Syntax and isolated sales tests
        run: |
          node --check server.js
          node --check src/web/public/landing/sales.js
          node tests/r47-sales-landing.test.js
      - name: All public assets integrity
        run: node tools/verify-public-assets.js
