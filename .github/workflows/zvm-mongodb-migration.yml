name: ZVM MongoDB database migration QA (no deployment)

on:
  pull_request:
    paths:
      - 'server.js'
      - 'runtime-config.js'
      - 'tools/zvm-mongodb-migrate.js'
      - 'tests/r85-mongo-rename-guard.test.js'
      - 'tests/r86-mongo-crossdb-copy.test.js'
      - 'src/db-cutover-guard.js'
      - 'tests/r87-db-cutover-guard.test.js'
      - 'tests/r88-mongo-source-stability.test.js'
      - 'tools/zvm-mongodb-backup-proof.js'
      - 'tools/zvm-mongodb-local-restore.js'
      - 'tests/r89-backup-restore-gate.test.js'
      - 'tests/r91-mongo-collection-options.test.js'
      - 'tests/r92-mongodb-real-e2e.test.js'
      - 'tools/zvm-db-backup-readonly.ps1'
      - 'package.json'
      - '.github/workflows/zvm-mongodb-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Verify syntax and migration safety without MongoDB credentials
        run: npm run check:db-migration
      - name: Parse Windows backup operator script (no database access)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tools/zvm-db-backup-readonly.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }


  real-mongo-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Install pinned MongoDB Node driver (no project scripts)
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Start throwaway MongoDB 8 Docker container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name zvm-r92-mongodb \
            -p 127.0.0.1:27018:27017 mongo:8.0 --bind_ip_all
          ready=0
          for i in $(seq 1 45); do
            if docker exec zvm-r92-mongodb mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -qx '1'; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
      - name: Install official MongoDB Database Tools from the throwaway container
        shell: bash
        run: |
          set -euo pipefail
          mongo_tool=$(docker exec zvm-r92-mongodb sh -c 'command -v mongorestore')
          test -n "$mongo_tool"
          mkdir -p "$RUNNER_TEMP/zvm-r92-tools"
          docker cp "zvm-r92-mongodb:$mongo_tool" "$RUNNER_TEMP/zvm-r92-tools/mongorestore"
          mongo_dump_tool=$(docker exec zvm-r92-mongodb sh -c 'command -v mongodump')
          docker cp "zvm-r92-mongodb:$mongo_dump_tool" "$RUNNER_TEMP/zvm-r92-tools/mongodump"
          chmod 700 "$RUNNER_TEMP/zvm-r92-tools/mongorestore" "$RUNNER_TEMP/zvm-r92-tools/mongodump"
          "$RUNNER_TEMP/zvm-r92-tools/mongorestore" --version >/dev/null
          "$RUNNER_TEMP/zvm-r92-tools/mongodump" --version >/dev/null
          echo "$RUNNER_TEMP/zvm-r92-tools" >> "$GITHUB_PATH"
      - name: End-to-end MongoDB 8 tests with synthetic documents only
        env:
          CI: 'true'
          GITHUB_ACTIONS: 'true'
          ZVM_R92_EPHEMERAL_ACK: 'throwaway-mongo-only'
        run: node tests/r92-mongodb-real-e2e.test.js
      - name: Destroy ephemeral MongoDB instance and all test data
        if: always()
        shell: bash
        run: docker rm -f zvm-r92-mongodb >/dev/null 2>&1 || true
