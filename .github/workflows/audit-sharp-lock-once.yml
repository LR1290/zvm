name: One-time sharp lockfile regeneration (audit branch only)
on:
  push:
    branches: [audit/security-gates-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regenerate-offline-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve patched sharp and update lockfile in disposable runner
        run: npm install sharp@0.35.5 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Confirm clean installation and native module
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          node -e "const s=require('sharp'); console.log('SHARP_RUNTIME_OK version='+s.versions.sharp+' libvips='+s.versions.vips)"
      - name: SCA validation
        run: npm audit --omit=dev --audit-level=high
      - name: Emit changed lockfile for human-reviewed commit (no write token)
        run: |
          node -e "const fs=require('fs'); const txt=fs.readFileSync('package-lock.json').toString('base64');console.log('ZVM_LOCK_BEGIN');for(let i=0;i<txt.length;i+=2048){console.log('ZVM_LOCK_CHUNK '+String(i/2048).padStart(4,'0')+' '+txt.slice(i,i+2048))};console.log('ZVM_LOCK_END')"
