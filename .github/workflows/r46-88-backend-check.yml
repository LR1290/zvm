name: ZVM Backend Regression
on:
  push:
    branches: ['fix/r46-88-admin-field-level-cas']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  admin-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Admin R46.37/R46.80/R46.84/R46.86/R46.87/R46.88
        run: |
          node tests/r46-37-admin-authority.test.js
          node tests/r46-80-admin-analytics-limits.test.js
          node tests/r46-84-admin-renew-compat.test.js
          node tests/r46-86-legacy-write-isolation.test.js
          node tests/r46-87-admin-atomic-renewal.test.js
          node tests/r46-88-admin-field-cas.test.js
      - name: Complete branch check (record all existing failures)
        run: npm run check
        continue-on-error: true
  baseline-css:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Complete baseline check on unmodified R46.87 main
        run: npm run check
        continue-on-error: true
