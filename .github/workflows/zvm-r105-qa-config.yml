name: ZVM R105 QA config verification (no deployment)

on:
  pull_request:
    paths:
      - "lab/qa-completa-r104/**"
      - "lab/signing-r104/**"
      - ".github/workflows/zvm-r105-qa-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-config:
    name: verify QA isolation and public-only DEV attestation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit tests without network access to Atlas or Render
        run: |
          node --test lab/qa-completa-r104/*.test.cjs
          node --test lab/signing-r104/qa-free.test.cjs
          node --test lab/signing-r104/fingerprint-order.test.cjs
          python3 -m py_compile lab/signing-r104/preparar.py lab/signing-r104/verificar.py
      - name: Validate QA-only integrated server without reapplying patches
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js
          node --check lab/qa-completa-r104/start-qa.cjs
          node -e "const s=require('fs').readFileSync('server.js','utf8');if(!s.includes('qa-verifier-only.cjs')||!s.includes('qa-free.cjs'))process.exit(1)"
          git diff --check
      - name: Verify no private key or other QA secrets committed
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E -- '-----BEGIN (EC |RSA |ED25519 )?PRIVATE KEY-----' lab/qa-completa-r104/; then
            echo 'Private key detected in QA configuration; refusing checkout'
            exit 1
          fi
