name: SSX Alpine preview regression
on:
  pull_request:
    paths:
      - 'src/hobbies/ssx/**'
      - 'tests/ssx2012-*.test.cjs'
      - '.github/workflows/ssx-alpine-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ssx-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Parse JS modules
        run: |
          node --check src/hobbies/ssx/route.js
          node --check src/hobbies/ssx/alpine-v37.js
          node --check src/hobbies/ssx/special-categories-v1.js
          node --check src/hobbies/ssx/special-leaders-core.js
      - name: Run SSX v36 + v37 isolation regression
        run: node --test tests/ssx2012-route.test.cjs tests/ssx2012-alpine-v37.test.cjs
      - name: Read-only source provenance inventory
        run: node --test tests/ssx2012-source-inventory.test.cjs
      - name: Reconciliation proof and ID matching safeguards
        run: |
          node --check src/hobbies/ssx/reconciliation-core.cjs
          node --check tools/ssx-reconcile-readonly.cjs
          node --test tests/ssx2012-reconciliation.test.cjs
          node --check src/hobbies/ssx/coverage-audit.cjs
          node --test tests/ssx2012-coverage-audit.test.cjs
      - name: Inspect original archived special-category structures (read-only)
        run: node --test tests/ssx2012-special-source-scan.test.cjs tests/ssx2012-special-leaders.test.cjs
      - name: Chromium real desktop/mobile integration
        run: |
          google-chrome --version
          node --test tests/ssx2012-alpine-browser.test.cjs
      - name: Store visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssx-v37-alpine-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
